version: '3.8'

services:
  ubuntu2204:
    image: ubuntu:22.04
    container_name: ubuntu2204-x86
    platform: linux/amd64  # 强制使用 x86 架构
    stdin_open: true   # 等价于 -i
    tty: true          # 等价于 -t
    command: /bin/bash      # 启动后进入 bash
    # restart: "no"      # 避免退出后自动重启
#

# docker run -it ubu2204 ubuntu:22.04 /bin/bash